<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
button,input,textarea{font:inherit}
/* Layout: full-bleed painted stall anchored to its counter; the bunch is held first-person at the bottom; wrapping and receiving happen centre-stage with a paper card beside (desktop) or below (phone) */
:root{
  --ink:#1e271f;
  --ink-soft:#5a6253;
  --card:#fbf5e8;
  --card-line:rgba(90,64,36,.18);
  --stall:#4c6a44;
  --stall-hover:#5a7a51;
  --kraft-ink:#3b2a1a;
  --font-display:"Gloock", Georgia, "Times New Roman", serif;
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#3b3a33;color:var(--ink);font-family:var(--font-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#3b3a33;z-index:50}

/* loader */
.loader{position:fixed;inset:0;z-index:200;background:#f3ead8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s ease}
.loader.out{opacity:0;pointer-events:none}
.loader .bloom{width:96px;height:96px;border-radius:50%;background:url(sunflower.webp) no-repeat;background-size:218px auto;background-position:-57px -14px;animation:spin 6s linear infinite}
.loader h1{font-family:var(--font-display);font-weight:400;font-size:26px;margin:0}
.loader p{font-family:var(--font-hand);font-size:22px;margin:0;color:var(--ink-soft)}
@keyframes spin{to{transform:rotate(360deg)}}

.scene{position:fixed;inset:0;overflow:hidden;touch-action:pan-y}
.frame{position:absolute;left:0;top:0;will-change:transform}
.frame > img{display:block;width:100%;height:100%;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.bucket{position:absolute;border:0;padding:0;background:transparent;cursor:pointer;border-radius:40% 40% 12px 12px;-webkit-tap-highlight-color:transparent}
.bucket:focus-visible{outline:2px solid #fff;outline-offset:4px}
.label{position:absolute;left:50%;top:63%;transform:translateX(-50%) rotate(var(--r,-3deg));transform-origin:50% -10px;background:#efe3cc;color:var(--kraft-ink);font-family:var(--font-hand);font-weight:700;font-size:clamp(15px,1.5vw,22px);line-height:1;padding:5px 10px 6px;border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.25);white-space:nowrap;pointer-events:none;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.label::before{content:"";position:absolute;left:50%;top:-5px;width:26px;height:9px;margin-left:-13px;background:rgba(255,255,255,.55);transform:rotate(2deg)}
.bucket:hover .label,.bucket:focus-visible .label{transform:translateX(-50%) rotate(calc(var(--r,-3deg) * -1.6))}
.label small{display:block;font-family:var(--font-body);font-weight:500;font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-top:2px}

/* the bunch: a zero-size origin at the binding point; everything is placed around it */
.bunch{position:fixed;left:0;top:0;width:0;height:0;z-index:22;pointer-events:none;transform-origin:0 0;will-change:transform}
.bunch .st,.bunch .ext{position:absolute;transition:left .7s cubic-bezier(.3,1,.4,1), top .7s cubic-bezier(.3,1,.4,1), transform .7s cubic-bezier(.3,1,.4,1), width .7s, height .7s, filter .7s}
.bunch .st{max-width:none;display:block;user-select:none;-webkit-user-drag:none}
.bunch .hd{pointer-events:none}
body.touch-heads .bunch .hd{pointer-events:auto;cursor:pointer}
.bunch .ext{background:linear-gradient(90deg,#4e3c30 0,#4e3c30 14%,#8f9370 27%,#abad87 50%,#898e69 73%,#4e3c30 86%,#4e3c30 100%);border-radius:0 0 45% 45%/0 0 6px 6px}
.bunch .tie{position:absolute;z-index:90000;transition:opacity .3s}
.bunch .layer{position:absolute;isolation:isolate}
.bunch .layer img{display:block;width:100%;height:100%}
.bunch .layer .tint{position:absolute;inset:0;mix-blend-mode:multiply;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.bunch .btag{position:absolute;z-index:96000;transform-origin:46% 14%}
.bunch .btag img{display:block;width:100%;height:100%;filter:drop-shadow(0 3px 4px rgba(60,40,20,.25))}
.bunch .btag .bt{position:absolute;left:5%;right:34%;top:40%;bottom:6%;overflow:hidden;font-family:var(--font-hand);color:#2c2318;text-align:center;line-height:1}
.bunch .btag .bt small{display:block;font-size:13px;font-weight:500;opacity:.7}
.bunch .btag .bt b{display:block;font-size:21px;font-weight:700;white-space:nowrap;margin-top:2px}
.bunch .btag .bt i{display:block;font-style:normal;font-size:13px;margin-top:6px;opacity:.75;white-space:nowrap}
.swing{animation:swing 4.5s ease-in-out infinite}
@keyframes swing{0%,100%{rotate:6deg}50%{rotate:11deg}}

.flyer{position:fixed;left:0;top:0;z-index:30;pointer-events:none;max-width:none;filter:drop-shadow(0 12px 14px rgba(0,0,0,.25))}
.confetti{position:fixed;inset:0;width:100%;height:100%;z-index:23;pointer-events:none}
.petal{position:fixed;top:-20px;z-index:23;pointer-events:none;border-radius:60% 40% 60% 40%;opacity:.9}

/* chrome */
.ui{position:fixed;inset:0;pointer-events:none;z-index:24;font-size:14px}
.panel{pointer-events:auto;background:var(--card);border:1px solid var(--card-line);border-radius:6px;box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 2px 0 rgba(90,64,36,.06),0 8px 20px rgba(60,40,20,.14)}
.top{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.brand{padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.brand h1{font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1.1;margin:2px 0 0}
.mute{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--card-line);background:#fff8ec;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.mute:hover{background:#fff}
.mute:focus-visible{outline:2px solid var(--stall);outline-offset:2px}
.mute svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tin{padding:10px 12px}
.tin .eyebrow{margin-bottom:8px}
.tin .row{display:flex;gap:8px}
.filler{width:62px;border:1px solid rgba(0,0,0,.08);background:#fff;border-radius:6px;padding:4px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:11px;color:var(--ink)}
.filler:hover{background:#fbf8f1;box-shadow:0 0 0 2px rgba(76,106,68,.25)}
.filler:focus-visible{outline:2px solid var(--stall);outline-offset:2px}
.thumb{width:44px;height:44px;border-radius:50%;background-repeat:no-repeat;background-color:#f1eee6;flex:none}

.invite{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,calc(100% - 32px));padding:16px 18px 16px;text-align:center;box-sizing:border-box}
.invite h2{font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.15;margin:0 0 4px;text-wrap:balance}
.invite p{margin:0 0 12px;color:var(--ink-soft);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{font:inherit;font-size:13.5px;font-weight:500;padding:8px 13px;border-radius:999px;border:1px solid rgba(90,64,36,.25);background:#fff8ec;color:var(--ink);cursor:pointer}
.chip:hover{background:#fff;border-color:rgba(76,106,68,.55)}
.chip:focus-visible{outline:2px solid var(--stall);outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--stall);color:#f6f1e6;border-color:transparent}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(251,245,232,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--card-line);box-shadow:0 -8px 24px rgba(60,40,20,.12);pointer-events:auto}
.bottom .btn{box-shadow:none}
.count{margin-top:6px;padding-top:6px;border-top:1px dashed var(--card-line);font-size:12.5px;line-height:1.3;color:var(--ink);font-variant-numeric:tabular-nums}
.count b{font-family:var(--font-display);font-weight:400;font-size:16px;margin-right:2px}
.count small{display:block;color:var(--ink-soft);font-size:11.5px}
button.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;border-radius:6px;padding:11px 18px;border:1px solid rgba(90,64,36,.22);background:var(--card);color:var(--ink);pointer-events:auto;transition:background .15s, transform .15s;box-shadow:0 2px 0 rgba(90,64,36,.1),0 6px 14px rgba(60,40,20,.12)}
button.btn:hover{background:#fff}
button.btn .ic{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button.btn:active{transform:scale(.97)}
button.btn:focus-visible{outline:2px solid #fff;outline-offset:2px;box-shadow:0 0 0 4px var(--stall)}
button.btn.primary{background:var(--stall);color:#f6f1e6;border-color:transparent}
button.btn.primary:hover{background:var(--stall-hover)}
button.btn.ghost{box-shadow:none;background:transparent;border-color:rgba(90,64,36,.25)}
button.btn.ghost:hover{background:rgba(255,255,255,.6)}
button.btn:disabled{opacity:.5;cursor:default;transform:none}
.toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);z-index:60;padding:9px 16px;font-family:var(--font-hand);font-size:22px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
.drag-hint{position:absolute;left:50%;top:calc(42% - 20px);transform:translateX(-50%);padding:7px 13px;border-radius:999px;font-size:12px;display:none}

/* wrapping table and gift view */
.room-bg{position:fixed;inset:0;z-index:20;background:radial-gradient(70% 70% at 40% 55%,rgba(255,244,220,.2),rgba(20,22,16,.66));backdrop-filter:blur(8px) saturate(.9);-webkit-backdrop-filter:blur(8px) saturate(.9);opacity:0;pointer-events:none;transition:opacity .6s}
.room-bg.on{opacity:1;pointer-events:auto}
body.tap-step .room-bg{cursor:pointer}
.room-ui{position:fixed;inset:0;z-index:24;pointer-events:none}
.room-head{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:12px;color:#fbf6ea}
.room-head .eyebrow{color:rgba(251,246,234,.78)}
.room-head h2{font-family:var(--font-display);font-weight:400;font-size:clamp(22px,2.8vw,32px);line-height:1.12;margin:4px 0 0;text-shadow:0 2px 14px rgba(0,0,0,.35);text-wrap:balance}
.room-head .mute{pointer-events:auto}
.side{position:absolute;right:max(24px,env(safe-area-inset-right,0px));top:50%;translate:0 -50%;width:min(400px,calc(100% - 48px));max-height:calc(100% - 120px);overflow-y:auto;pointer-events:auto;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px}
.side h3{font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1.2;margin:2px 0 0;text-wrap:balance}
.side p{margin:0;line-height:1.5;color:var(--ink-soft);text-wrap:pretty}
.group{display:flex;flex-direction:column;gap:8px}
.group > label,.group > .eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:11.5px;cursor:pointer;padding:0}
.sw i{width:36px;height:36px;border-radius:50%;display:block;box-shadow:0 1px 3px rgba(0,0,0,.25),inset 0 0 0 1px rgba(0,0,0,.08)}
.sw[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--stall)}
.sw:focus-visible{outline:none}
.sw:focus-visible i{box-shadow:0 0 0 2px var(--card),0 0 0 4px #9fd3b5}
.field{font:inherit;font-size:15px;padding:10px 12px;border-radius:6px;border:1px solid rgba(90,64,36,.25);background:#fffdf7;color:var(--ink);width:100%;box-sizing:border-box}
.field:focus-visible{outline:2px solid var(--stall);outline-offset:1px}
textarea.field{font-family:var(--font-hand);font-size:22px;line-height:1.15;min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two > div{display:flex;flex-direction:column;gap:6px;min-width:0}
.two label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.notes{display:flex;flex-wrap:wrap;gap:6px}
.notes .chip{font-family:var(--font-hand);font-size:18px;font-weight:500;padding:4px 12px;text-align:left;border-radius:14px}
.who .chip{font-size:12.5px;padding:6px 11px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.side .acts .btn{padding:10px 14px;font-size:13.5px;white-space:nowrap;gap:7px}
.side .acts .btn .ic{width:16px;height:16px}
.linkbox{display:flex;gap:6px;align-items:center}
.linkbox input{flex:1;min-width:0;font:inherit;font-size:12px;padding:10px 11px;border-radius:6px;border:1px solid rgba(90,64,36,.25);background:#fff;color:var(--ink)}
.small{font-size:12.5px;color:var(--ink-soft);line-height:1.45}
.step{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--stall);font-weight:600}
.msg{font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1.25;margin:0;text-wrap:balance}
.warm{font-family:var(--font-display);font-weight:400;font-size:19px;line-height:1.35;margin:0;color:var(--ink);text-wrap:pretty}
.hero-note{margin:0;font-family:var(--font-hand);font-weight:500;font-size:34px;line-height:1.08;color:#2c2318;overflow-wrap:anywhere;text-wrap:balance}
.hero-note cite{display:block;font-style:normal;font-size:24px;margin-top:8px;color:var(--ink-soft)}
.handle{display:none}
.hero-note.solo{font-size:28px;line-height:1.12}
.note{margin:0;padding:12px 14px;background:#fffdf7;border:1px dashed rgba(90,64,36,.3);border-radius:4px;font-family:var(--font-hand);font-size:24px;line-height:1.15;color:#2c2318;overflow-wrap:anywhere}
.note cite{display:block;font-style:normal;font-size:20px;text-align:right;margin-top:6px;color:var(--ink-soft)}
.mean{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mean li{display:flex;align-items:center;gap:8px;min-width:0}
.mean .thumb{width:34px;height:34px}
.mean span{font-size:12.5px;line-height:1.25;min-width:0}
.mean b{display:block;font-weight:600;font-size:13px}
.tap-hint{position:fixed;z-index:26;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--card);border:1px solid var(--card-line);box-shadow:0 8px 20px rgba(0,0,0,.25);font-weight:600;font-size:14px;cursor:pointer;color:var(--ink);font-family:inherit}
.tap-hint svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tap-hint.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.06)}}
.bubble{position:fixed;z-index:70;width:min(280px,calc(100vw - 32px));box-sizing:border-box;padding:12px 14px 13px;background:var(--card);border:1px solid var(--card-line);border-radius:6px;box-shadow:0 10px 24px rgba(0,0,0,.25);text-align:left;pointer-events:none}
.bubble .bh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.bubble .bh b{display:block;font-family:var(--font-display);font-weight:400;font-size:19px;line-height:1.1}
.bubble .bh span{display:block;font-family:var(--font-hand);font-size:19px;line-height:1;color:var(--ink-soft)}
.bubble p{margin:0;font-size:13.5px;line-height:1.45;color:var(--ink)}
.mean li{cursor:pointer;border-radius:6px;padding:2px;margin:-2px}
.mean li:hover{background:rgba(76,106,68,.08)}
.mean li[aria-pressed="true"]{background:rgba(76,106,68,.12);box-shadow:inset 0 0 0 1.5px var(--stall)}
.mean li:focus-visible{outline:2px solid var(--stall);outline-offset:1px}
.bunch .hand{position:absolute;z-index:90000;pointer-events:none}
.bunch .hand img{display:block;width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(40,25,10,.25))}
.intro{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;background:radial-gradient(70% 70% at 50% 45%,rgba(255,244,220,.25),rgba(20,22,16,.7));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.intro .card{position:relative;width:min(380px,100%);padding:30px 26px 24px;text-align:center;box-sizing:border-box;background:var(--card);border-radius:8px;box-shadow:0 20px 50px rgba(0,0,0,.35);border:1px solid var(--card-line)}
.intro .card::before{content:"";position:absolute;left:50%;top:-14px;width:84px;height:26px;margin-left:-42px;background:rgba(239,227,204,.9);transform:rotate(-3deg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.intro .eyebrow{color:var(--stall);font-weight:600}
.intro h2{font-family:var(--font-hand);font-weight:700;font-size:44px;line-height:1;margin:10px 0 8px;overflow-wrap:anywhere}
.intro p{margin:0 0 20px;color:var(--ink-soft);font-size:15px;line-height:1.5;text-wrap:balance}
.intro .stamp{display:block;margin:0 auto 12px;width:74px;height:74px;border-radius:50%;background-repeat:no-repeat;box-shadow:0 0 0 3px var(--card),0 0 0 4px rgba(76,106,68,.4)}
.bubble b{display:block;font-family:var(--font-display);font-weight:400;font-size:17px}
.bubble span{font-family:var(--font-hand);font-size:20px;line-height:1.05}
.modal{position:fixed;inset:0;z-index:150;background:rgba(20,18,14,.7);display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.modal .panel{padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center;max-width:min(460px,100%);max-height:100%;box-sizing:border-box}
.modal img{max-width:100%;max-height:68vh;border-radius:4px;display:block}
.fade-in{animation:fadein .5s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (max-width:760px){
  .brand{padding:8px 8px 8px 12px}
  .brand .eyebrow{display:none}
  .brand h1{font-size:18px}
  .tin .eyebrow{display:none}
  .filler{width:44px;font-size:0;padding:4px}
  .filler .thumb{width:34px;height:34px}

// ---------- the bunch ----------
const bunch = $('bunch');

let pose = {x:0, y:0, rot:0, sc:1};
let SEED = 0;               // changes with "Rearrange"; travels in the gift link

function arrange(n){

function slotFor(i, n, vk, rank = i){

  const k = D*s.rel*sj*edge/(s.d*s.h);
  const w = s.w*k, h = s.h*k;
  const front = 1 - r;

// the painting's stem leans a little inside its image; turn the image so that lean points at the binding too
function stemRot(st, sl){

// every stem keeps its own angle and a fixed depth, so adding or removing one only nudges the others
function ranks(n){

}
function relayout(){ const rk = ranks(hand.length); hand.forEach((st,i)=> placeStem(st, slotFor(i, hand.length, st.vk, rk[i]))); }

function handPose(n){
  const vw = innerWidth, vh = innerHeight, A = arrange(n), phone = vw < 760;
  const sc = Math.min(.1*vh/D, (phone ? .36 : .46)*vh/(-A.top + .25*D), (phone ? .9 : .42)*vw/(2*A.half));

function applyPose(p, animate){

    const prev = `translate(${pose.x}px,${pose.y}px) rotate(${pose.rot}deg) scale(${pose.sc})`;

const tie = document.createElement('img'); tie.className = 'tie'; tie.src = 'ribbon.webp'; tie.alt = '';
Object.assign(tie.style, {width:(1.15*D)+'px', height:(1.15*D*784/640)+'px', left:(-.575*D)+'px', top:(-.28*D)+'px', opacity:0});
bunch.appendChild(tie);

function makeStem(type, vk, flip){
  if(vk == null) vk = STEMS[type].alt && Math.random() < .45 ? type + '2' : type;
  if(flip == null) flip = Math.random() < .5;
  const img = document.createElement('img'); img.className = 'st'; img.src = vk + '.webp'; img.alt = '';
  const head = document.createElement('img'); head.className = 'st hd'; head.src = vk + '.webp'; head.alt = '';
  const ext = document.createElement('div'); ext.className = 'ext';
  bunch.appendChild(ext); bunch.appendChild(img); bunch.appendChild(head);

}
const both = st => [st.img, st.head];

// ---------- picking ----------
let tt;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(()=>t.classList.remove('show'), 2000); }

function addStem(type){
  if(!hand.length && mode !== 'room') track('First Stem Picked', {flower:type});
  if(hand.length >= MAX){ toast('That\u2019s an armful. Time to wrap them.'); return null; }
  const st = makeStem(type);
  both(st).forEach(e=> e.style.visibility = 'hidden'); st.ext.style.visibility = 'hidden';
  [st.img, st.head, st.ext].forEach(e=> e.style.transition = 'none');
  hand.push(st);
  const n = hand.length;
  placeStem(st, slotFor(n-1, n, st.vk, ranks(n)[n-1]));
  st.img.getBoundingClientRect();
  [st.img, st.head, st.ext].forEach(e=> e.style.transition = '');
  relayout();

  tie.style.opacity = 1;

}
function land(st){
  both(st).forEach(e=> e.style.visibility = ''); st.ext.style.visibility = '';
  if(!reduce) bunch.animate([{transform:bunch.style.transform + ' rotate(1.5deg)'},{transform:bunch.style.transform}], {duration:420, easing:'cubic-bezier(.3,1.6,.5,1)'});
}
function flyTo(st, start){
  const s = S(st.vk), sl = st.sl;
  const end = toScreen(sl.px, sl.py, pose);
  const endSc = pose.sc, endRot = stemRot(st, sl) + pose.rot;
  const w = sl.w, h = sl.h, ox = s.hx*w, oy = s.hy*h;
  const f = document.createElement('img'); f.className = 'flyer'; f.src = st.vk + '.webp'; f.alt = '';
  Object.assign(f.style, {width:w+'px', height:h+'px', transformOrigin:`${ox}px ${oy}px`});
  document.body.appendChild(f);
  const T = (x,y,r,sc)=>`translate(${x - ox}px,${y - oy}px) rotate(${r}deg) scale(${sc})${st.flip ? ' scaleX(-1)' : ''}`;
  const frames = [];
  if(start.rim != null){
    // pulled straight up out of the bucket; the rim hides whatever is still inside
    const below = (1 - s.hy)*h*start.sc;
    const y0 = start.rim + .35*D*start.sc, y1 = start.rim - below - 6;
    const inset = y => Math.max(0, Math.min(h, h - (oy + (start.rim - y)/start.sc)));

  }

}
function pull(b){

  const sc = (.05*F.w)/(D*STEMS[b.type].rel);
  const x = F.x + b.x*F.w + (Math.random() - .5)*.04*F.w;
  flyTo(st, {x, sc: Math.min(sc, pose.sc*1.6), rim: F.y + MOUTH*F.h});

function addFrom(type, rect){

function removeStem(st){

  st.img.animate([{opacity:1, transform:t},{opacity:0, transform:t + ' translateY(70px)'}], {duration:320, fill:'forwards'}).onfinish = ()=>{ st.img.remove(); st.head.remove(); st.ext.remove(); };

function headTap(e){

}
function counts(list){ const c = {}; list.forEach(t=>c[t]=(c[t]||0)+1); return c; }

      const u = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=> URL.revokeObjectURL(u), 4000); toast('Saved to your downloads'); return;
    }
    showImageModal(URL.createObjectURL(blob));
  } finally { if(btn) btn.disabled = false; }
}
function showImageModal(url){
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="panel"><img alt="Your bouquet as an image" src="${url}"><p class="small">Press and hold the image, or right-click it, to save it.</p><button class="btn" type="button">Close</button></div>`;
  m.querySelector('button').onclick = ()=> m.remove();
  m.addEventListener('click', e=>{ if(e.target === m) m.remove(); });
  document.body.appendChild(m);
}

// ---------- start ----------
addEventListener('resize', ()=>{
  layoutStall();
  applyPose(mode !== 'room' ? handPose(hand.length) : (step === 'handover' || step === 'arriving') ? handoverPose() : step === 'gift-open' ? openPose(hand.length) : roomPose(hand.length), 0);
  if(!$('tapHint').hidden && step !== 'handover'){ const G = wrapGeom(hand.length), p = toScreen(0, -.55*G.Hc); $('tapHint').style.left = p.x + 'px'; $('tapHint').style.top = p.y + 'px'; }
});
layoutStall(); applyPose(handPose(0), 0); updateUI();

// open the stall as soon as the painting is in; everything else streams in behind it.
// A gift waits for only what it needs: its own flowers and the wrapping.
const WRAP_ASSETS = ['fan.webp','sleeve.webp','ribbon.webp','tag.webp','hand.webp'];
const giftAtStart = readGift();
const need = ['stall.webp'].concat(giftAtStart ? WRAP_ASSETS.concat([...new Set(giftAtStart.stems.map(s=> s.vk + '.webp'))]) : []);
const ready = Promise.race([Promise.all(need.map(loadImg)), new Promise(r=> setTimeout(r, 9000))]);
ready.then(()=>{ Object.keys(GEO).map(k=> k + '.webp').concat(WRAP_ASSETS).forEach(loadImg); });
Promise.all([ready, sleep(700)]).then(()=>{
  $('loader').classList.add('out'); setTimeout(()=> $('loader').remove(), 700);
  const gift = readGift();
  track('Page Viewed', {role: gift ? 'recipient' : 'sender', referrer: document.referrer ? new URL(document.referrer).hostname : ''});
  if(gift){
    track('Gift Opened', {gift_id: gift.id, stems: gift.stems.length, has_note: !!gift.note});
    paper = gift.paper; ribbon = gift.ribbon; SEED = gift.seed;
    mode = 'room';
    gift.stems.forEach(s=> hand.push(makeStem(s.type, s.vk, s.flip)));
    hand.forEach(st=> [st.img, st.head, st.ext].forEach(e=> e.style.transition = 'none'));
    enterRoom();
    applyPose(roomPose(hand.length), 0);
    requestAnimationFrame(()=> hand.forEach(st=> [st.img, st.head, st.ext].forEach(e=> e.style.transition = '')));
    openGiftView(gift, false);
  }
});
})();
</script>
